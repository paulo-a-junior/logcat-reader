name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.3'
  APP_NAME: logcat_reader

jobs:
  version:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        name: Parse vA.B.C
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' does not match vA.B.C"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            # Build against an old glibc (2.31) so the binary also runs
            # on older distributions; the ubuntu-20.04 runner is retired.
            container: ubuntu:20.04
          - platform: windows
            # Flutter 3.27 only knows the VS 2019/2022 CMake generators;
            # windows-latest ships VS 2026, so pin the VS 2022 image.
            os: windows-2022
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Runs before checkout: the container starts without git.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq unzip xz-utils zip file \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - uses: actions/checkout@v4

      # The workspace and tool cache are bind-mounted from the host with a
      # different owner, which makes git (and Flutter's version check) bail.
      - name: Trust mounted directories
        if: matrix.platform == 'linux'
        run: git config --global --add safe.directory '*'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build
        shell: bash
        run: >-
          flutter build ${{ matrix.platform }} --release
          --build-name "$VERSION"
          --build-number "${{ github.run_number }}"

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          cp -r build/linux/x64/release/bundle "dist/${APP_NAME}"
          tar -C dist -czf "${APP_NAME}-${VERSION}-linux-x64.tar.gz" "${APP_NAME}"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release "dist/$env:APP_NAME"
          Compress-Archive -Path "dist/$env:APP_NAME" `
            -DestinationPath "$env:APP_NAME-$env:VERSION-windows-x64.zip"

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/${APP_NAME}.app" \
            "${APP_NAME}-${VERSION}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.APP_NAME }}-*.tar.gz
            ${{ env.APP_NAME }}-*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Logcat Reader ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | Linux (x64) | `logcat_reader-${{ needs.version.outputs.version }}-linux-x64.tar.gz` — extract and run `logcat_reader/logcat_reader` (glibc 2.31+, e.g. Ubuntu 20.04 or newer; needs GTK 3) |
            | Windows (x64) | `logcat_reader-${{ needs.version.outputs.version }}-windows-x64.zip` — extract and run `logcat_reader.exe` |
            | macOS (Universal) | `logcat_reader-${{ needs.version.outputs.version }}-macos.zip` — unsigned: right-click → Open on first launch, or `xattr -dr com.apple.quarantine logcat_reader.app` |

            `adb` must be on `PATH` (or set the `ADB` environment variable).
